version: v1

services:
  account-db:
    image: postgres:15.3-alpine
    container_name: accounts-db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: accounts_db
    volumes:
      - ./app-source/src/accounts/accounts-db/initdb:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"

  ledger_db:
    image: postgres:15.3-alpine
    container_name: ledger-db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: ledger_db
      USE_DEMO_DATA: "True"
      LOCAL_ROUTING_NUM: "883745000"

    volumes:
      - ./app-source/src/ledger/ledger-db/initdb:/docker-entrypoint-initdb.d
    ports:
      - "5433:5432"

    