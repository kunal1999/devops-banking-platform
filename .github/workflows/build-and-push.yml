name: Build and Push Docker Images

on:
  push:
    branches:
    - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push userservice
      uses: docker/build-push-action@v5
      with:
        context: app-source/src/accounts/userservice
        file: docker/userservice/Dockerfile
        push: true
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/devops-banking-platform-userservice:latest
          ${{ secrets.DOCKER_USERNAME }}/devops-banking-platform-userservice:${{ github.sha }}

    - name: Build and push contacts
      uses: docker/build-push-action@v5
      with:
        context: app-source/src/accounts/contacts
        file: docker/contacts/Dockerfile
        push: true
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/devops-banking-platform-contacts:latest
          ${{ secrets.DOCKER_USERNAME }}/devops-banking-platform-contacts:${{ github.sha }}

    - name: Build and push ledgerwriter
      uses: docker/build-push-action@v5
      with:
        context: app-source/src/ledger/ledgerwriter
        file: docker/ledgerwriter/Dockerfile
        push: true
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/devops-banking-platform-ledgerwriter:latest
          ${{ secrets.DOCKER_USERNAME }}/devops-banking-platform-ledgerwriter:${{ github.sha }}

    - name: Build and push balancereader
      uses: docker/build-push-action@v5
      with:
        context: app-source/src/ledger/balancereader
        file: docker/balancereader/Dockerfile
        push: true
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/devops-banking-platform-balancereader:latest
          ${{ secrets.DOCKER_USERNAME }}/devops-banking-platform-balancereader:${{ github.sha }}

    - name: Build and push transactionhistory
      uses: docker/build-push-action@v5
      with:
        context: app-source/src/ledger/transactionhistory
        file: docker/transactionhistory/Dockerfile
        push: true
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/devops-banking-platform-transactionhistory:latest
          ${{ secrets.DOCKER_USERNAME }}/devops-banking-platform-transactionhistory:${{ github.sha }}

    - name: Build and push frontend
      uses: docker/build-push-action@v5
      with:
        context: app-source/src/frontend
        file: docker/frontend/Dockerfile
        push: true
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/devops-banking-platform-frontend:latest
          ${{ secrets.DOCKER_USERNAME }}/devops-banking-platform-frontend:${{ github.sha }}

    - name: Workflow completed
      run: echo "All images built and pushed successfully to Docker Hub!"

    - name: Update Kubernetes manifests with new image tags
      run: |
        # Update all deployment files with new image tags
        sed -i "s|image: .*devops-banking-platform-userservice:.*|image: ${{ secrets.DOCKER_USERNAME }}/devops-banking-platform-userservice:${{ github.sha }}|g" k8s/userservice/deployment.yml
        sed -i "s|image: .*devops-banking-platform-contacts:.*|image: ${{ secrets.DOCKER_USERNAME }}/devops-banking-platform-contacts:${{ github.sha }}|g" k8s/contacts/deployment.yml
        sed -i "s|image: .*devops-banking-platform-ledgerwriter:.*|image: ${{ secrets.DOCKER_USERNAME }}/devops-banking-platform-ledgerwriter:${{ github.sha }}|g" k8s/ledgerwriter/deployment.yml
        sed -i "s|image: .*devops-banking-platform-balancereader:.*|image: ${{ secrets.DOCKER_USERNAME }}/devops-banking-platform-balancereader:${{ github.sha }}|g" k8s/balancereader/deployment.yml
        sed -i "s|image: .*devops-banking-platform-transactionhistory:.*|image: ${{ secrets.DOCKER_USERNAME }}/devops-banking-platform-transactionhistory:${{ github.sha }}|g" k8s/transactionhistory/deployment.yml
        sed -i "s|image: .*devops-banking-platform-frontend:.*|image: ${{ secrets.DOCKER_USERNAME }}/devops-banking-platform-frontend:${{ github.sha }}|g" k8s/frontend/deployment.yml

    - name: Commit and push updated manifests
      run: |
        git config --local user.email "github-actions@github.com"
        git config --local user.name "GitHub Actions"
        git add k8s/*/deployment.yml
        git commit -m "Update K8s manifests with new image tags - ${{ github.sha }}" || echo "No changes to commit"
        git push
