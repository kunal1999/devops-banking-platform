apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: transactionhistory-hpa
  namespace: bank-of-anthos
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: transactionhistory
  minReplicas: 1
  maxReplicas: 3
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
