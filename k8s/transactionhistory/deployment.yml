apiVersion: apps/v1
kind: Deployment
metadata:
  name: transactionhistory
  namespace: bank-of-anthos
spec:
  replicas: 1
  selector:
    matchLabels:
      app: transactionhistory
  template:
    metadata:
      labels:
        app: transactionhistory
    spec:
      containers:
      - name: transactionhistory
        image: devops-banking-platform-transactionhistory:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        env:
        - name: VERSION
          valueFrom:
            configMapKeyRef:
              name: transactionhistory-config
              key: VERSION
        - name: PORT
          valueFrom:
            configMapKeyRef:
              name: transactionhistory-config
              key: PORT
        - name: LOCAL_ROUTING_NUM
          valueFrom:
            configMapKeyRef:
              name: transactionhistory-config
              key: LOCAL_ROUTING_NUM
        - name: PUB_KEY_PATH
          value: "/etc/secrets/jwtRS256.key.pub"
        - name: ENABLE_TRACING
          valueFrom:
            configMapKeyRef:
              name: transactionhistory-config
              key: ENABLE_TRACING
        - name: SPRING_DATASOURCE_URL
          valueFrom:
            configMapKeyRef:
              name: transactionhistory-config
              key: SPRING_DATASOURCE_URL
        - name: SPRING_DATASOURCE_USERNAME
          valueFrom:
            secretKeyRef:
              name: ledger-db-credentials
              key: POSTGRES_USER
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: ledger-db-credentials
              key: POSTGRES_PASSWORD

        volumeMounts:
        - name: keys-volume
          mountPath: "/etc/secrets"
          readOnly: true

        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5

      volumes:
      - name: keys-volume
        secret:
          secretName: jwt-key
